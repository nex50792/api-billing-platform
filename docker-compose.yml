
services:
  db:
    image: postgres:18-alpine
    container_name: billing-db
    command: ["postgres", "-p", "5436"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_billing
    ports:
      - "5434:5436"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5436"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:18-alpine
    container_name: billing-db-test
    profiles: [test]
    command: ["postgres", "-p", "5436"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_billing_test
    ports:
      - "5435:5436"
    volumes:
      - db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5436"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billing-api
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5436"
      DB_NAME: api_billing
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/app/migrations
  builder:
    image: golang:1.26-alpine
    profiles: [test]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db_test
      DB_PORT: 5436
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: api_billing_test
    depends_on:
      db_test:
        condition: service_healthy
    command: go test -p 1 ./internal/... -v

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [tools]
    entrypoint: [
      "migrate",
      "-database", "postgres://postgres:postgres@db:5436/api_billing?sslmode=disable",
      "-path", "/app/migrations"
    ]
    volumes:
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  db-test-data:
